<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Special Date ❤️</title>


<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">


</head>


<body>


<!-- OPENING -->

<div id="openingScreen" class="opening-screen">

<div class="opening-content">

<div class="opening-heart">
❤️
</div>

<h1 class="typing-text">
Something Special
</h1>


<p>
A little surprise has been created only for you... ✨
</p>


<div class="opening-stars">
✨ ✨ ✨
</div>


<button id="enterButton">
OPEN MY HEART 💕
</button>


</div>

</div>



<!-- CONTROLS -->


<button id="darkModeButton">
🌙
</button>


<button id="musicButton">
🎵
</button>




<!-- MAIN -->


<div class="container">


<div class="proposal-screen">


<div class="proposal-content">



<img src="kitty.png"
class="kitty"
alt="kitty">





<div class="proposal-box">


<div class="special-line">
💕 MADE ESPECIALLY FOR YOU 💕
</div>



<h1>
Hey You... ❤️
</h1>



<h2>
Will you go on a special date with me? 🥺❤️
</h2>



<p>
I promise it will become a beautiful memory.
🌹
</p>




<div class="proposal-buttons">


<button id="yesButton">
YES ❤️
</button>



<button id="noButton">
NO 😜
</button>


</div>


</div>


</div>


</div>


</div>




<audio id="backgroundMusic" loop>

<source src="music.mp3">

</audio>




<script src="script.js"></script>


</body>


</html>
